<svg xmlns="http://www.w3.org/2000/svg" width="980" height="440" viewBox="0 0 980 440"><rect x="0" y="0" width="980" height="440" rx="18" fill="#F4F8F7"/><text x="490" y="54" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1F3A5F" font-weight="bold" text-anchor="middle" letter-spacing="3">ONE HOUR, OFF DUTY</text><text x="490" y="84" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52709E" text-anchor="middle" letter-spacing="0.5">A chamber session: pressure rises gently, holds while you read or nap, and eases back.</text><g fill="none" stroke="#1F3A5F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M 290 220 L 290 182 Q 290 156 320 156 L 660 156 Q 690 156 690 182 L 690 220 Q 690 246 660 246 L 320 246 Q 290 246 290 220 Z"/><circle cx="640" cy="201" r="16" stroke="#52709E" stroke-width="3"/><path d="M 330 214 Q 352 196 376 208 L 560 208" stroke="#52709E" stroke-width="3"/><circle cx="348" cy="192" r="10" stroke="#52709E" stroke-width="3"/><rect x="430" y="184" width="44" height="26" rx="4" stroke="#52709E" stroke-width="2.5"/></g><line x1="140" y1="370" x2="840" y2="370" stroke="#1F3A5F" stroke-width="2.5" stroke-linecap="round"/><path d="M 160 356 L 280 316 L 700 316 L 820 356" fill="none" stroke="#1F3A5F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52709E" text-anchor="middle"><text x="216" y="306">ears pop, like a plane</text><text x="490" y="306" font-size="13.5" fill="#1F3A5F" font-weight="bold">about an hour, phone-free</text><text x="768" y="306">gentle descent</text><text x="490" y="398" font-size="13">a short screening chat comes first, and that is a good sign</text></g></svg>
