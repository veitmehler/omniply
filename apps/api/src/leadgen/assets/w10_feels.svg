<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470"><defs></defs><rect x="0" y="0" width="980" height="470" rx="18" fill="#F4F8F7"/><text x="490" y="52" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#1F3A5F" font-weight="bold" text-anchor="middle" letter-spacing="1">WHAT EACH ONE FEELS LIKE</text><text x="490" y="86" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#52709E" text-anchor="middle">Six common tools, in plain terms. Every session is adjustable, and you can stop any time.</text><rect x="70" y="120" width="270" height="150" rx="14" fill="#FFFFFF" stroke="#D7EBE8" stroke-width="3"/><rect x="100" y="150" width="130" height="56" rx="28" fill="#35507A"/><rect x="116" y="164" width="76" height="28" rx="14" fill="#D7EBE8"/><text x="205" y="238" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1F3A5F" font-weight="bold" text-anchor="middle">Oxygen chamber</text><text x="205" y="258" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#52709E" text-anchor="middle">Ears pop like a plane. Most people nap.</text><rect x="355" y="120" width="270" height="150" rx="14" fill="#FFFFFF" stroke="#D7EBE8" stroke-width="3"/><rect x="395" y="168" width="190" height="20" rx="10" fill="#35507A"/><circle cx="490" cy="156" r="18" fill="none" stroke="#52709E" stroke-width="5"/><circle cx="490" cy="156" r="30" fill="none" stroke="#D7EBE8" stroke-width="4"/><text x="490" y="238" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1F3A5F" font-weight="bold" text-anchor="middle">PEMF mat</text><text x="490" y="258" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#52709E" text-anchor="middle">Lie back. A gentle pulse, or nothing at all.</text><rect x="640" y="120" width="270" height="150" rx="14" fill="#FFFFFF" stroke="#D7EBE8" stroke-width="3"/><rect x="700" y="142" width="64" height="104" rx="22" fill="#35507A"/><rect x="712" y="156" width="40" height="18" rx="9" fill="#D7EBE8"/><rect x="712" y="182" width="40" height="18" rx="9" fill="#D7EBE8"/><rect x="712" y="208" width="40" height="18" rx="9" fill="#D7EBE8"/><text x="775" y="238" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1F3A5F" font-weight="bold" text-anchor="middle">Compression</text><text x="775" y="258" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#52709E" text-anchor="middle">A firm squeeze that travels in waves.</text><rect x="70" y="290" width="270" height="150" rx="14" fill="#FFFFFF" stroke="#D7EBE8" stroke-width="3"/><rect x="100" y="338" width="180" height="18" rx="9" fill="#D7EBE8"/><rect x="118" y="356" width="14" height="40" rx="7" fill="#52709E"/><rect x="248" y="356" width="14" height="40" rx="7" fill="#52709E"/><circle cx="300" cy="330" r="16" fill="#FAF0D7"/><text x="205" y="410" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1F3A5F" font-weight="bold" text-anchor="middle">Massage and bodywork</text><text x="205" y="430" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#52709E" text-anchor="middle">The familiar one. Pressure is your call.</text><rect x="355" y="290" width="270" height="150" rx="14" fill="#FFFFFF" stroke="#D7EBE8" stroke-width="3"/><rect x="432" y="316" width="116" height="26" rx="13" fill="#35507A"/><rect x="452" y="322" width="76" height="14" rx="7" fill="#FAF0D7"/><polyline points="446,372 466,352 490,392 514,352 534,372" fill="none" stroke="#52709E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="490" y="410" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1F3A5F" font-weight="bold" text-anchor="middle">Training bands</text><text x="490" y="430" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#52709E" text-anchor="middle">Light moves, snug bands, muscles feel it fast.</text><rect x="640" y="290" width="270" height="150" rx="14" fill="#FFFFFF" stroke="#D7EBE8" stroke-width="3"/><rect x="684" y="318" width="92" height="78" rx="12" fill="#FAF0D7"/><polyline points="712,336 700,360 724,360 712,384" fill="none" stroke="#35507A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="792" y="318" width="92" height="78" rx="12" fill="#D7EBE8"/><circle cx="838" cy="357" r="18" fill="none" stroke="#35507A" stroke-width="5"/><polyline points="838,331 838,383" fill="none" stroke="#35507A" stroke-width="5" stroke-linecap="round"/><polyline points="812,357 864,357" fill="none" stroke="#35507A" stroke-width="5" stroke-linecap="round"/><text x="775" y="410" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1F3A5F" font-weight="bold" text-anchor="middle">Heat and cold</text><text x="775" y="430" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#52709E" text-anchor="middle">Short, strong sensations. Always optional.</text></svg>
