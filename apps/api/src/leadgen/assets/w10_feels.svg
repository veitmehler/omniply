<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470"><rect x="0" y="0" width="980" height="470" rx="18" fill="#F4F8F7"/><text x="490" y="52" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1F3A5F" font-weight="bold" text-anchor="middle" letter-spacing="3">WHAT EACH ONE FEELS LIKE</text><text x="490" y="82" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52709E" text-anchor="middle" letter-spacing="0.5">Six common tools, in plain terms. Every session is adjustable, and you can stop any time.</text><g fill="none" stroke="#1F3A5F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="70" y="112" width="270" height="156" rx="14" stroke="#1F3A5F" stroke-width="1.6" opacity="0.35"/><rect x="355" y="112" width="270" height="156" rx="14" stroke="#1F3A5F" stroke-width="1.6" opacity="0.35"/><rect x="640" y="112" width="270" height="156" rx="14" stroke="#1F3A5F" stroke-width="1.6" opacity="0.35"/><rect x="70" y="284" width="270" height="156" rx="14" stroke="#1F3A5F" stroke-width="1.6" opacity="0.35"/><rect x="355" y="284" width="270" height="156" rx="14" stroke="#1F3A5F" stroke-width="1.6" opacity="0.35"/><rect x="640" y="284" width="270" height="156" rx="14" stroke="#1F3A5F" stroke-width="1.6" opacity="0.35"/></g><g fill="none" stroke="#1F3A5F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M 148 170 L 148 158 Q 148 144 164 144 L 246 144 Q 262 144 262 158 L 262 170 Q 262 184 246 184 L 164 184 Q 148 184 148 170 Z"/><circle cx="240" cy="164" r="7" stroke="#52709E" stroke-width="2.5"/><circle cx="490" cy="156" r="12" stroke="#52709E" stroke-width="2.5"/><circle cx="490" cy="156" r="22" stroke="#52709E" stroke-width="2.2"/><rect x="420" y="176" width="140" height="12" rx="6"/><path d="M 748 142 L 748 184 Q 748 196 760 196 L 772 196 Q 784 196 784 184 L 784 142 Q 784 134 776 134 L 756 134 Q 748 134 748 142 Z"/><path d="M 796 142 L 796 184 Q 796 196 808 196 L 820 196 Q 832 196 832 184 L 832 142 Q 832 134 824 134 L 804 134 Q 796 134 796 142 Z"/><line x1="754" y1="156" x2="778" y2="156" stroke="#52709E" stroke-width="2.5"/><line x1="802" y1="156" x2="826" y2="156" stroke="#52709E" stroke-width="2.5"/><line x1="754" y1="172" x2="778" y2="172" stroke="#52709E" stroke-width="2.5"/><line x1="802" y1="172" x2="826" y2="172" stroke="#52709E" stroke-width="2.5"/><rect x="138" y="336" width="134" height="12" rx="6"/><line x1="152" y1="348" x2="148" y2="372" stroke-width="2.5"/><line x1="258" y1="348" x2="262" y2="372" stroke-width="2.5"/><circle cx="292" cy="326" r="9" stroke="#52709E" stroke-width="2.5"/><rect x="444" y="322" width="92" height="18" rx="9"/><polyline points="452,372 468,352 490,384 512,352 528,372" stroke="#52709E" stroke-width="2.8"/><rect x="700" y="318" width="64" height="56" rx="9"/><polyline points="726,330 716,350 736,350 726,370" stroke="#52709E" stroke-width="2.5"/><rect x="788" y="318" width="64" height="56" rx="9"/><circle cx="820" cy="346" r="13" stroke="#52709E" stroke-width="2.5"/><line x1="820" y1="327" x2="820" y2="365" stroke="#52709E" stroke-width="2.2"/><line x1="801" y1="346" x2="839" y2="346" stroke="#52709E" stroke-width="2.2"/></g><g font-family="Helvetica, Arial, sans-serif" text-anchor="middle"><text x="205" y="222" font-size="15.5" fill="#1F3A5F" font-weight="bold">Oxygen chamber</text><text x="205" y="242" font-size="13" fill="#52709E">ears pop like a plane; most people nap</text><text x="490" y="222" font-size="15.5" fill="#1F3A5F" font-weight="bold">PEMF mat</text><text x="490" y="242" font-size="13" fill="#52709E">a gentle pulse, or nothing at all</text><text x="775" y="222" font-size="15.5" fill="#1F3A5F" font-weight="bold">Compression</text><text x="775" y="242" font-size="13" fill="#52709E">a firm squeeze that travels in waves</text><text x="205" y="394" font-size="15.5" fill="#1F3A5F" font-weight="bold">Massage and bodywork</text><text x="205" y="414" font-size="13" fill="#52709E">the familiar one; pressure is your call</text><text x="490" y="394" font-size="15.5" fill="#1F3A5F" font-weight="bold">Training bands</text><text x="490" y="414" font-size="13" fill="#52709E">light moves, muscles feel it fast</text><text x="775" y="394" font-size="15.5" fill="#1F3A5F" font-weight="bold">Heat and cold</text><text x="775" y="414" font-size="13" fill="#52709E">short, strong, always optional</text></g></svg>
