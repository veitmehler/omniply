<svg xmlns="http://www.w3.org/2000/svg" width="980" height="440" viewBox="0 0 980 440"><rect x="0" y="0" width="980" height="440" rx="18" fill="#F4F8F7"/><text x="490" y="54" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1F3A5F" font-weight="bold" text-anchor="middle" letter-spacing="3">WHAT BOUNCING BACK LOOKS LIKE</text><text x="490" y="84" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52709E" text-anchor="middle" letter-spacing="0.5">The same stress, two recoveries. The gap between the curves is trainable.</text><line x1="120" y1="350" x2="880" y2="350" stroke="#1F3A5F" stroke-width="2.5"/><line x1="120" y1="350" x2="120" y2="120" stroke="#1F3A5F" stroke-width="2.5"/><polyline points="874,344 884,350 874,356" fill="none" stroke="#1F3A5F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="114,126 120,116 126,126" fill="none" stroke="#1F3A5F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="132" y="118" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52709E">how ready you feel</text><text x="868" y="376" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52709E" text-anchor="end">days after a hard effort</text><line x1="120" y1="178" x2="880" y2="178" stroke="#52709E" stroke-width="1.5" stroke-dasharray="3 8" stroke-linecap="round"/><text x="876" y="170" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52709E" text-anchor="end">your baseline</text><path d="M 150 178 C 200 180 220 320 260 322 C 330 324 420 196 520 176 C 580 166 640 162 700 166" fill="none" stroke="#1F3A5F" stroke-width="4" stroke-linecap="round"/><path d="M 150 178 C 200 180 220 320 260 322 C 360 328 560 300 700 262 C 760 246 820 232 866 222" fill="none" stroke="#52709E" stroke-width="3" stroke-dasharray="10 9" stroke-linecap="round"/><circle cx="260" cy="322" r="6" fill="#F4F8F7" stroke="#1F3A5F" stroke-width="3"/><text x="260" y="300" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1F3A5F" text-anchor="middle" font-weight="bold">the dip</text><text x="640" y="140" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1F3A5F" font-weight="bold">fast bounce-back</text><text x="640" y="158" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52709E">back past baseline, ready to go again</text><text x="700" y="298" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52709E" font-weight="bold">slow bounce-back</text><text x="700" y="316" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52709E">still dragging days later</text><g stroke="#1F3A5F" stroke-width="2" stroke-linecap="round"><line x1="560" y1="186" x2="560" y2="280"/><polyline points="554,192 560,184 566,192" fill="none" stroke-linejoin="round"/><polyline points="554,272 560,280 566,272" fill="none" stroke-linejoin="round"/></g><text x="572" y="238" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1F3A5F" font-weight="bold">the gap</text></svg>
