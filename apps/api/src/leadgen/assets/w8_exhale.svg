<svg xmlns="http://www.w3.org/2000/svg" width="980" height="440" viewBox="0 0 980 440"><rect x="0" y="0" width="980" height="440" rx="18" fill="#F4F8F7"/><text x="490" y="54" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1F3A5F" font-weight="bold" text-anchor="middle" letter-spacing="3">THE LONG EXHALE</text><text x="490" y="84" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52709E" text-anchor="middle" letter-spacing="0.5">Breathe in for four, out for eight. Two minutes is a real intervention.</text><line x1="120" y1="300" x2="880" y2="300" stroke="#1F3A5F" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/><path d="M 140 300 C 170 300 184 180 214 180 C 254 180 300 296 380 299 C 420 300 440 300 460 300 C 490 300 504 186 534 186 C 574 186 620 296 700 299 C 740 300 760 300 780 300 C 810 300 824 190 854 190" fill="none" stroke="#1F3A5F" stroke-width="4" stroke-linecap="round"/><g fill="none" stroke="#52709E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="152" y1="146" x2="212" y2="146"/><polyline points="204,140 212,146 204,152"/><line x1="236" y1="146" x2="430" y2="146"/><polyline points="244,140 236,146 244,152"/></g><g font-family="Helvetica, Arial, sans-serif"><text x="178" y="130" font-size="13.5" fill="#1F3A5F" font-weight="bold" text-anchor="middle">in, 4</text><text x="330" y="130" font-size="13.5" fill="#52709E" font-weight="bold" text-anchor="middle">out, 8</text><text x="490" y="352" font-size="14" fill="#1F3A5F" text-anchor="middle" font-weight="bold">Long exhales lean on the brake your nervous system already owns.</text><text x="490" y="376" font-size="13" fill="#52709E" text-anchor="middle">Through the nose, shoulders down, no app required.</text></g></svg>
