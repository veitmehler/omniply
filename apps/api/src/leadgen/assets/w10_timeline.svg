<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430"><defs></defs><rect x="0" y="0" width="980" height="430" rx="18" fill="#F4F8F7"/><text x="490" y="52" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#1F3A5F" font-weight="bold" text-anchor="middle" letter-spacing="1">YOUR FIRST VISIT, STEP BY STEP</text><text x="490" y="86" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#52709E" text-anchor="middle">Plan for 60 to 90 minutes in all. Follow-ups are shorter.</text><rect x="110" y="208" width="760" height="8" rx="4" fill="#D7EBE8"/><circle cx="170" cy="212" r="34" fill="#1F3A5F"/><text x="170" y="222" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#FAF0D7" font-weight="bold" text-anchor="middle">1</text><text x="170" y="282" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1F3A5F" font-weight="bold" text-anchor="middle">Welcome and goals</text><text x="170" y="306" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52709E" text-anchor="middle">A relaxed chat about you</text><rect x="128" y="322" width="84" height="26" rx="13" fill="#D7EBE8"/><text x="170" y="340" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="middle">10-15 min</text><circle cx="383" cy="212" r="34" fill="#35507A"/><text x="383" y="222" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#FAF0D7" font-weight="bold" text-anchor="middle">2</text><text x="383" y="282" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1F3A5F" font-weight="bold" text-anchor="middle">Assessment</text><text x="383" y="306" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52709E" text-anchor="middle">Movement, sleep, stress, fuel</text><rect x="341" y="322" width="84" height="26" rx="13" fill="#D7EBE8"/><text x="383" y="340" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="middle">15-20 min</text><circle cx="597" cy="212" r="34" fill="#52709E"/><text x="597" y="222" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#FAF0D7" font-weight="bold" text-anchor="middle">3</text><text x="597" y="282" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1F3A5F" font-weight="bold" text-anchor="middle">Try a session</text><text x="597" y="306" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52709E" text-anchor="middle">Your first modality, guided</text><rect x="555" y="322" width="84" height="26" rx="13" fill="#D7EBE8"/><text x="597" y="340" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="middle">20-40 min</text><circle cx="810" cy="212" r="34" fill="#1F3A5F"/><text x="810" y="222" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#FAF0D7" font-weight="bold" text-anchor="middle">4</text><text x="810" y="282" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1F3A5F" font-weight="bold" text-anchor="middle">Your plan</text><text x="810" y="306" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52709E" text-anchor="middle">What fits your actual week</text><rect x="768" y="322" width="84" height="26" rx="13" fill="#D7EBE8"/><text x="810" y="340" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="middle">About 10 min</text><circle cx="120" cy="120" r="3" fill="#52709E"/><circle cx="872" cy="128" r="3" fill="#52709E"/><circle cx="500" cy="132" r="3" fill="#52709E"/></svg>
