<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430"><rect x="0" y="0" width="980" height="430" rx="18" fill="#F4F8F7"/><text x="490" y="52" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1F3A5F" font-weight="bold" text-anchor="middle" letter-spacing="3">THE TASTER DAY, STATION BY STATION</text><text x="490" y="82" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52709E" text-anchor="middle" letter-spacing="0.5">Plan about three hours, unhurried by design. Strong start, soft landing.</text><line x1="110" y1="200" x2="882" y2="200" stroke="#1F3A5F" stroke-width="2.5" stroke-linecap="round"/><polyline points="874,194 884,200 874,206" fill="none" stroke="#1F3A5F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g fill="#F4F8F7" stroke="#1F3A5F" stroke-width="3"><circle cx="150" cy="200" r="26"/><circle cx="320" cy="200" r="26"/><circle cx="490" cy="200" r="26"/><circle cx="660" cy="200" r="26"/><circle cx="830" cy="200" r="26"/></g><g font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1F3A5F" font-weight="bold" text-anchor="middle"><text x="150" y="208">1</text><text x="320" y="208">2</text><text x="490" y="208">3</text><text x="660" y="208">4</text><text x="830" y="208">5</text></g><g font-family="Helvetica, Arial, sans-serif" text-anchor="middle"><text x="150" y="262" font-size="16" fill="#1F3A5F" font-weight="bold">Ice bath</text><text x="150" y="284" font-size="13" fill="#52709E">the strong, honest start</text><text x="320" y="262" font-size="16" fill="#1F3A5F" font-weight="bold">Vibration plate</text><text x="320" y="284" font-size="13" fill="#52709E">wake the muscles up</text><text x="490" y="262" font-size="16" fill="#1F3A5F" font-weight="bold">PEMF mat</text><text x="490" y="284" font-size="13" fill="#52709E">the descent begins</text><text x="660" y="262" font-size="16" fill="#1F3A5F" font-weight="bold">Compression boots</text><text x="660" y="284" font-size="13" fill="#52709E">the soft landing</text><text x="830" y="262" font-size="16" fill="#1F3A5F" font-weight="bold">Orientation chat</text><text x="830" y="284" font-size="13" fill="#52709E">pointers for your goals</text></g><g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F3A5F" font-weight="bold" text-anchor="middle"><rect x="110" y="318" width="80" height="26" rx="13" fill="none" stroke="#1F3A5F" stroke-width="2"/><text x="150" y="336">2-5 MIN</text><rect x="280" y="318" width="80" height="26" rx="13" fill="none" stroke="#1F3A5F" stroke-width="2"/><text x="320" y="336">10 MIN</text><rect x="450" y="318" width="80" height="26" rx="13" fill="none" stroke="#1F3A5F" stroke-width="2"/><text x="490" y="336">20-30 MIN</text><rect x="620" y="318" width="80" height="26" rx="13" fill="none" stroke="#1F3A5F" stroke-width="2"/><text x="660" y="336">20-30 MIN</text><rect x="790" y="318" width="80" height="26" rx="13" fill="none" stroke="#1F3A5F" stroke-width="2"/><text x="830" y="336">10-15 MIN</text></g><text x="490" y="392" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52709E" text-anchor="middle">Nothing happens without your understanding and consent, and every exit is yours.</text></svg>
