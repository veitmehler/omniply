<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430"><rect x="0" y="0" width="980" height="430" rx="18" fill="#F4F8F7"/><text x="490" y="52" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1F3A5F" font-weight="bold" text-anchor="middle" letter-spacing="3">YOUR FIRST VISIT, STEP BY STEP</text><text x="490" y="82" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52709E" text-anchor="middle" letter-spacing="0.5">Plan for 60 to 90 minutes in all. Follow-ups are shorter.</text><line x1="120" y1="200" x2="872" y2="200" stroke="#1F3A5F" stroke-width="2.5" stroke-linecap="round"/><polyline points="864,194 874,200 864,206" fill="none" stroke="#1F3A5F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g fill="#F4F8F7" stroke="#1F3A5F" stroke-width="3"><circle cx="186" cy="200" r="26"/><circle cx="395" cy="200" r="26"/><circle cx="604" cy="200" r="26"/><circle cx="813" cy="200" r="26"/></g><g font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1F3A5F" font-weight="bold" text-anchor="middle"><text x="186" y="208">1</text><text x="395" y="208">2</text><text x="604" y="208">3</text><text x="813" y="208">4</text></g><g font-family="Helvetica, Arial, sans-serif" text-anchor="middle"><text x="186" y="262" font-size="16" fill="#1F3A5F" font-weight="bold">Welcome and goals</text><text x="186" y="284" font-size="13" fill="#52709E">a relaxed chat about you</text><text x="395" y="262" font-size="16" fill="#1F3A5F" font-weight="bold">Assessment</text><text x="395" y="284" font-size="13" fill="#52709E">move, sleep, stress, fuel</text><text x="604" y="262" font-size="16" fill="#1F3A5F" font-weight="bold">Try a session</text><text x="604" y="284" font-size="13" fill="#52709E">your first tool, guided</text><text x="813" y="262" font-size="16" fill="#1F3A5F" font-weight="bold">Your plan</text><text x="813" y="284" font-size="13" fill="#52709E">fits your actual week</text></g><g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F3A5F" font-weight="bold" text-anchor="middle"><rect x="146" y="318" width="80" height="26" rx="13" fill="none" stroke="#1F3A5F" stroke-width="2"/><text x="186" y="336">10-15 MIN</text><rect x="355" y="318" width="80" height="26" rx="13" fill="none" stroke="#1F3A5F" stroke-width="2"/><text x="395" y="336">15-20 MIN</text><rect x="564" y="318" width="80" height="26" rx="13" fill="none" stroke="#1F3A5F" stroke-width="2"/><text x="604" y="336">20-40 MIN</text><rect x="773" y="318" width="80" height="26" rx="13" fill="none" stroke="#1F3A5F" stroke-width="2"/><text x="813" y="336">10 MIN</text></g><text x="490" y="392" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52709E" text-anchor="middle">Nothing happens without your understanding and consent.</text></svg>
