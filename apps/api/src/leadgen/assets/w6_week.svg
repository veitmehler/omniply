<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430"><defs></defs><rect x="0" y="0" width="980" height="430" rx="18" fill="#F4F8F7"/><text x="490" y="52" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#1F3A5F" font-weight="bold" text-anchor="middle" letter-spacing="1">THE 20-MINUTE WEEK</text><text x="490" y="86" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#8A97A6" text-anchor="middle">Two short sessions beat one heroic hour that never happens</text><rect x="90" y="130" width="360" height="220" rx="16" fill="#FFFFFF" stroke="#D7EBE8" stroke-width="3"/><rect x="90" y="130" width="360" height="56" rx="16" fill="#1F3A5F"/><text x="270" y="166" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#FFFFFF" font-weight="bold" text-anchor="middle">SESSION A · 10 MIN</text><text x="120" y="226" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1F3A5F">Chair squats</text><text x="120" y="266" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1F3A5F">Wall or bench push-ups</text><text x="120" y="306" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1F3A5F">A loaded carry</text><circle cx="104" cy="220" r="5" fill="#52709E"/><circle cx="104" cy="260" r="5" fill="#52709E"/><circle cx="104" cy="300" r="5" fill="#52709E"/><rect x="530" y="130" width="360" height="220" rx="16" fill="#FFFFFF" stroke="#D7EBE8" stroke-width="3"/><rect x="530" y="130" width="360" height="56" rx="16" fill="#35507A"/><text x="710" y="166" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#FFFFFF" font-weight="bold" text-anchor="middle">SESSION B · 10 MIN</text><text x="560" y="226" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1F3A5F">Hinges with a light bag</text><text x="560" y="266" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1F3A5F">Band rows</text><text x="560" y="306" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1F3A5F">Balance hold, 30 s each side</text><circle cx="544" cy="220" r="5" fill="#52709E"/><circle cx="544" cy="260" r="5" fill="#52709E"/><circle cx="544" cy="300" r="5" fill="#52709E"/><text x="490" y="398" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#8A97A6" text-anchor="middle">Easy for two weeks in a row? Add a little weight, a few repeats, or a slower tempo. One change at a time.</text></svg>
