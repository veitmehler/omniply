<svg xmlns="http://www.w3.org/2000/svg" width="980" height="440" viewBox="0 0 980 440"><rect x="0" y="0" width="980" height="440" rx="18" fill="#F4F8F7"/><text x="490" y="54" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1F3A5F" font-weight="bold" text-anchor="middle" letter-spacing="3">THE RECOVERY STACK, ONE SESSION</text><text x="490" y="84" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52709E" text-anchor="middle" letter-spacing="0.5">Three tools, about an hour, in the order most studios run them</text><line x1="120" y1="330" x2="860" y2="330" stroke="#1F3A5F" stroke-width="2.5"/><polyline points="852,324 862,330 852,336" fill="none" stroke="#1F3A5F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g stroke="#1F3A5F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="175" y="238" width="130" height="16" rx="8"/><line x1="196" y1="254" x2="188" y2="282"/><line x1="284" y1="254" x2="292" y2="282"/><polyline points="214,222 214,210 222,202 258,202 266,210 266,222"/><polyline points="226,190 226,178"/><polyline points="240,186 240,172"/><polyline points="254,190 254,178"/></g><circle cx="240" cy="330" r="7" fill="#F4F8F7" stroke="#1F3A5F" stroke-width="3"/><g stroke="#1F3A5F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M 455 196 L 455 262 Q 455 274 467 274 L 489 274 Q 501 274 501 262 L 501 196 Q 501 186 491 186 L 465 186 Q 455 186 455 196 Z"/><path d="M 517 196 L 517 262 Q 517 274 529 274 L 551 274 Q 563 274 563 262 L 563 196 Q 563 186 553 186 L 527 186 Q 517 186 517 196 Z"/><line x1="462" y1="214" x2="494" y2="214" stroke="#52709E"/><line x1="462" y1="236" x2="494" y2="236" stroke="#52709E"/><line x1="524" y1="214" x2="556" y2="214" stroke="#52709E"/><line x1="524" y1="236" x2="556" y2="236" stroke="#52709E"/></g><circle cx="509" cy="330" r="7" fill="#F4F8F7" stroke="#1F3A5F" stroke-width="3"/><g stroke="#1F3A5F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="700" y="252" width="150" height="20" rx="10"/><path d="M 745 232 Q 775 212 805 232" stroke="#52709E"/><path d="M 735 214 Q 775 184 815 214" stroke="#52709E"/><path d="M 725 196 Q 775 156 825 196"/></g><circle cx="775" cy="330" r="7" fill="#F4F8F7" stroke="#1F3A5F" stroke-width="3"/><g font-family="Helvetica, Arial, sans-serif" text-anchor="middle"><text x="240" y="368" font-size="16" fill="#1F3A5F" font-weight="bold">Whole-body vibration</text><text x="240" y="390" font-size="13.5" fill="#52709E">wakes the tissue up</text><text x="509" y="368" font-size="16" fill="#1F3A5F" font-weight="bold">Compression</text><text x="509" y="390" font-size="13.5" fill="#52709E">moves fluid out, in waves</text><text x="775" y="368" font-size="16" fill="#1F3A5F" font-weight="bold">PEMF</text><text x="775" y="390" font-size="13.5" fill="#52709E">downshifts the system</text></g><g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1F3A5F" font-weight="bold" text-anchor="middle"><rect x="206" y="118" width="68" height="26" rx="13" fill="none" stroke="#1F3A5F" stroke-width="2"/><text x="240" y="136">10 MIN</text><rect x="475" y="118" width="68" height="26" rx="13" fill="none" stroke="#1F3A5F" stroke-width="2"/><text x="509" y="136">25 MIN</text><rect x="741" y="118" width="68" height="26" rx="13" fill="none" stroke="#1F3A5F" stroke-width="2"/><text x="775" y="136">20 MIN</text></g><line x1="240" y1="144" x2="240" y2="170" stroke="#52709E" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/><line x1="509" y1="144" x2="509" y2="172" stroke="#52709E" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/><line x1="775" y1="144" x2="775" y2="148" stroke="#52709E" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/></svg>
