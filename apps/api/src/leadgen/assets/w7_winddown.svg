<svg xmlns="http://www.w3.org/2000/svg" width="980" height="440" viewBox="0 0 980 440"><rect x="0" y="0" width="980" height="440" rx="18" fill="#F4F8F7"/><text x="490" y="54" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1F3A5F" font-weight="bold" text-anchor="middle" letter-spacing="3">THE WIND-DOWN HOUR, ENGINEERED</text><text x="490" y="84" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52709E" text-anchor="middle" letter-spacing="0.5">Not discipline. A descent, in three twenty-minute moves.</text><line x1="120" y1="320" x2="860" y2="320" stroke="#1F3A5F" stroke-width="2.5" stroke-linecap="round"/><polyline points="852,314 862,320 852,326" fill="none" stroke="#1F3A5F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g fill="none" stroke="#1F3A5F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="200" y="176" width="78" height="96" rx="8"/><line x1="216" y1="200" x2="262" y2="200" stroke="#52709E"/><line x1="216" y1="220" x2="262" y2="220" stroke="#52709E"/><line x1="216" y1="240" x2="248" y2="240" stroke="#52709E"/><path d="M 440 232 Q 456 196 472 224 Q 492 264 540 236" stroke-width="3.5"/><circle cx="440" cy="232" r="4" fill="#1F3A5F"/><rect x="664" y="236" width="150" height="18" rx="9"/><path d="M 704 216 Q 739 196 774 216" stroke="#52709E"/><path d="M 694 198 Q 739 170 784 198" stroke="#52709E" stroke-width="2.5"/></g><g font-family="Helvetica, Arial, sans-serif" text-anchor="middle"><text x="239" y="300" font-size="15" fill="#1F3A5F" font-weight="bold">Close the loops</text><text x="490" y="300" font-size="15" fill="#1F3A5F" font-weight="bold">Slow the breath</text><text x="739" y="300" font-size="15" fill="#1F3A5F" font-weight="bold">Stillness, any means</text></g><g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F3A5F" font-weight="bold" text-anchor="middle"><rect x="197" y="344" width="84" height="26" rx="13" fill="none" stroke="#1F3A5F" stroke-width="2"/><text x="239" y="362">0 TO 20</text><rect x="448" y="344" width="84" height="26" rx="13" fill="none" stroke="#1F3A5F" stroke-width="2"/><text x="490" y="362">20 TO 40</text><rect x="697" y="344" width="84" height="26" rx="13" fill="none" stroke="#1F3A5F" stroke-width="2"/><text x="739" y="362">40 TO 60</text></g><g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52709E" text-anchor="middle"><text x="239" y="400">tomorrow, on paper</text><text x="490" y="400">exhale longer than inhale</text><text x="739" y="400">paper, floor, or the mat</text></g></svg>
