<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430"><defs></defs><rect x="0" y="0" width="980" height="430" rx="18" fill="#F4F8F7"/><text x="490" y="52" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#1F3A5F" font-weight="bold" text-anchor="middle" letter-spacing="1">THE 60-MINUTE LANDING PATTERN</text><text x="490" y="86" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#8A97A6" text-anchor="middle">Bodies do not have an off switch; they have a descent</text><path d="M 90 150 C 340 150 640 300 890 316" fill="none" stroke="#D7EBE8" stroke-width="8" stroke-linecap="round"/><circle cx="120" cy="152" r="34" fill="#1F3A5F"/><text x="120" y="160" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle">60</text><rect x="64" y="208" width="112" height="2" fill="none"/><text x="120" y="222" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1F3A5F" font-weight="bold" text-anchor="middle">Screens dim</text><text x="120" y="246" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8A97A6" text-anchor="middle">list written</text><circle cx="380" cy="194" r="34" fill="#35507A"/><text x="380" y="202" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle">45</text><text x="380" y="262" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1F3A5F" font-weight="bold" text-anchor="middle">Warm shower</text><text x="380" y="286" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8A97A6" text-anchor="middle">the cool-down signals sleep</text><circle cx="640" cy="266" r="34" fill="#52709E"/><text x="640" y="274" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold" text-anchor="middle">30</text><text x="640" y="334" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1F3A5F" font-weight="bold" text-anchor="middle">Something quiet</text><text x="640" y="358" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8A97A6" text-anchor="middle">reading, stretching, slow breathing</text><circle cx="890" cy="318" r="34" fill="#D7EBE8"/><circle cx="898" cy="312" r="18" fill="#F4F8F7"/><circle cx="890" cy="310" r="13" fill="#D7EBE8"/><text x="890" y="386" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1F3A5F" font-weight="bold" text-anchor="middle">Lights out</text></svg>
