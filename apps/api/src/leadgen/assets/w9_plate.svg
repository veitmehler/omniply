</text><text x="534" y="310">D</text><text x="668" y="358">B12</text><text x="780" y="312" fill="#52709E">Hg</text><text x="146" y="390" fill="#52709E">Pb</text></g><g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52709E" text-anchor="middle"><text x="250" y="352">iron</text><text x="392" y="398">magnesium</text><text x="534" y="346">vitamin D</text><text x="668" y="394">stores run for years</text><text x="780" y="268">exposure, not everyone</text><text x="146" y="348">old pipes, old paint</text></g><text x="862" y="224" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#52709E" text-anchor="end">the waterline</text></svg>
