<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430"><defs></defs><rect x="0" y="0" width="980" height="430" rx="18" fill="#F4F8F7"/><text x="490" y="52" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#1F3A5F" font-weight="bold" text-anchor="middle" letter-spacing="1">THE HALF-PLATE HABIT</text><text x="490" y="86" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#8A97A6" text-anchor="middle">One picture instead of calorie math, at lunch and dinner</text><circle cx="400" cy="256" r="124" fill="#FFFFFF" stroke="#D7EBE8" stroke-width="5"/><circle cx="400" cy="256" r="100" fill="none" stroke="#E8EEF2" stroke-width="3"/><path d="M 400 156 A 100 100 0 0 0 400 356 Z" fill="#7FA86B"/><circle cx="366" cy="222" r="12" fill="#5E8A4E"/><circle cx="352" cy="276" r="10" fill="#5E8A4E"/><circle cx="376" cy="320" r="9" fill="#5E8A4E"/><path d="M 400 156 A 100 100 0 0 1 500 256 L 400 256 Z" fill="#FAF0D7"/><path d="M 500 256 A 100 100 0 0 1 400 356 L 400 256 Z" fill="#D7EBE8"/><line x1="528" y1="196" x2="596" y2="178" stroke="#8A97A6" stroke-width="3"/><text x="610" y="182" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1F3A5F" font-weight="bold">A PALM OF PROTEIN</text><text x="610" y="208" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8A97A6">fish, eggs, dairy, tofu, beans</text><line x1="528" y1="318" x2="596" y2="336" stroke="#8A97A6" stroke-width="3"/><text x="610" y="340" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1F3A5F" font-weight="bold">THE FOUNDATION</text><text x="610" y="366" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8A97A6">rice, potatoes, pasta, bread</text><line x1="276" y1="252" x2="196" y2="252" stroke="#8A97A6" stroke-width="3"/><text x="186" y="244" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1F3A5F" font-weight="bold" text-anchor="end">HALF THE PLATE</text><text x="186" y="270" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8A97A6" text-anchor="end">vegetables or salad,</text><text x="186" y="292" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8A97A6" text-anchor="end">frozen counts</text></svg>
