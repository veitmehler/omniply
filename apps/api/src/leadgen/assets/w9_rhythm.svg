<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460"><rect x="0" y="0" width="980" height="460" rx="18" fill="#F4F8F7"/><text x="490" y="54" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1F3A5F" font-weight="bold" text-anchor="middle" letter-spacing="3">THE LOOP THAT BEATS GUESSING</text><text x="490" y="84" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52709E" text-anchor="middle" letter-spacing="0.5">A supplement drawer is a bet. This is a plan.</text><g fill="none" stroke="#1F3A5F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M 420 150 A 160 110 0 0 1 626 206" stroke-dasharray="1 9"/><path d="M 648 266 A 160 110 0 0 1 560 366" stroke-dasharray="1 9"/><path d="M 420 376 A 160 110 0 0 1 332 266" stroke-dasharray="1 9"/><path d="M 354 206 A 160 110 0 0 1 400 158" stroke-dasharray="1 9"/><polyline points="618,196 628,208 614,210"/><polyline points="574,354 560,366 576,372"/><polyline points="340,276 330,264 344,262"/><polyline points="396,166 406,156 408,170"/></g><g font-family="Helvetica, Arial, sans-serif" text-anchor="middle"><ellipse cx="490" cy="140" rx="98" ry="30" fill="none" stroke="#1F3A5F" stroke-width="3"/><text x="490" y="146" font-size="15.5" fill="#1F3A5F" font-weight="bold">MEASURE</text><ellipse cx="702" cy="252" rx="98" ry="30" fill="none" stroke="#1F3A5F" stroke-width="3"/><text x="702" y="247" font-size="15.5" fill="#1F3A5F" font-weight="bold">INTERPRET</text><text x="702" y="265" font-size="12.5" fill="#52709E">with a professional</text><ellipse cx="490" cy="380" rx="112" ry="30" fill="none" stroke="#1F3A5F" stroke-width="3"/><text x="490" y="378" font-size="15.5" fill="#1F3A5F" font-weight="bold">CHANGE ONE THING</text><text x="490" y="394" font-size="12.5" fill="#52709E">only one</text><ellipse cx="278" cy="252" rx="110" ry="30" fill="none" stroke="#1F3A5F" stroke-width="3"/><text x="278" y="247" font-size="15.5" fill="#1F3A5F" font-weight="bold">MEASURE AGAIN</text><text x="278" y="265" font-size="12.5" fill="#52709E">did it move?</text></g><text x="490" y="262" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#52709E" text-anchor="middle">status first,</text><text x="490" y="280" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#52709E" text-anchor="middle">then the plan writes itself</text></svg>
