<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430"><defs></defs><rect x="0" y="0" width="980" height="430" rx="18" fill="#F4F8F7"/><text x="490" y="52" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#1F3A5F" font-weight="bold" text-anchor="middle" letter-spacing="1">MEAL RHYTHM OVER WILLPOWER</text><text x="490" y="86" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#8A97A6" text-anchor="middle">Regular meals keep energy steadier than skip-then-raid</text><line x1="90" y1="250" x2="890" y2="250" stroke="#D7EBE8" stroke-width="7" stroke-linecap="round"/><circle cx="180" cy="250" r="34" fill="#FAF0D7" stroke="#E8CF8F" stroke-width="4"/><text x="180" y="258" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1F3A5F" text-anchor="middle">&#9728;</text><text x="180" y="316" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1F3A5F" font-weight="bold" text-anchor="middle">BREAKFAST</text><text x="180" y="340" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8A97A6" text-anchor="middle">include protein</text><circle cx="430" cy="250" r="34" fill="#D7EBE8"/><rect x="414" y="240" width="32" height="20" rx="4" fill="#1F3A5F"/><text x="430" y="316" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1F3A5F" font-weight="bold" text-anchor="middle">LUNCH</text><text x="430" y="340" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8A97A6" text-anchor="middle">away from the screen</text><circle cx="660" cy="250" r="34" fill="#35507A"/><circle cx="660" cy="250" r="14" fill="#F4F8F7"/><text x="660" y="316" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1F3A5F" font-weight="bold" text-anchor="middle">DINNER</text><text x="660" y="340" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8A97A6" text-anchor="middle">about 3 h before bed</text><path d="M 700 250 L 822 250" stroke="#52709E" stroke-width="5" stroke-das