<svg xmlns="http://www.w3.org/2000/svg" width="980" height="440" viewBox="0 0 980 440"><rect x="0" y="0" width="980" height="440" rx="18" fill="#F4F8F7"/><text x="490" y="54" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1F3A5F" font-weight="bold" text-anchor="middle" letter-spacing="3">THE LOOP THAT BEATS GUESSING</text><text x="490" y="84" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52709E" text-anchor="middle" letter-spacing="0.5">A supplement drawer is a bet. This is a plan.</text><g fill="none" stroke="#1F3A5F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="100" y="178" width="166" height="64" rx="32"/><rect x="314" y="178" width="166" height="64" rx="32"/><rect x="528" y="178" width="166" height="64" rx="32"/><rect x="742" y="178" width="166" height="64" rx="32"/><line x1="270" y1="210" x2="308" y2="210" stroke="#52709E"/><polyline points="301,204 309,210 301,216" stroke="#52709E"/><line x1="484" y1="210" x2="522" y2="210" stroke="#52709E"/><polyline points="515,204 523,210 515,216" stroke="#52709E"/><line x1="698" y1="210" x2="736" y2="210" stroke="#52709E"/><polyline points="729,204 737,210 729,216" stroke="#52709E"/><path d="M 825 246 L 825 310 Q 825 330 805 330 L 203 330 Q 183 330 183 310 L 183 250" stroke="#52709E" stroke-width="2.8" stroke-dasharray="1 9"/><polyline points="177,258 183,248 189,258" stroke="#52709E" stroke-width="2.8"/></g><g font-family="Helvetica, Arial, sans-serif" font-weight="bold" fill="#1F3A5F" font-size="16" text-anchor="middle"><text x="183" y="206">MEASURE</text><text x="397" y="206">INTERPRET</text><text x="611" y="199">CHANGE</text><text x="611" y="218">ONE THING</text><text x="825" y="206">MEASURE</text><text x="825" y="225">AGAIN</text></g><g font-family="Helvetica, Arial, sans-serif" fill="#52709E" font-size="12.5" text-anchor="middle"><text x="183" y="224">your status</text><text x="397" y="224">with a professional</text><text x="825" y="206" opacity="0">.</text></g><text x="504" y="362" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#52709E" text-anchor="middle">thirty days later, see what moved</text><text x="490" y="404" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1F3A5F" font-weight="bold" text-anchor="middle">Status first. Then the plan writes itself.</text></svg>
