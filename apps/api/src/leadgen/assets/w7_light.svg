<svg xmlns="http://www.w3.org/2000/svg" width="980" height="440" viewBox="0 0 980 440"><rect x="0" y="0" width="980" height="440" rx="18" fill="#F4F8F7"/><text x="490" y="54" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1F3A5F" font-weight="bold" text-anchor="middle" letter-spacing="3">LIGHT AND TEMPERATURE, TIMED</text><text x="490" y="84" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#52709E" text-anchor="middle" letter-spacing="0.5">Bright mornings set the clock. Warm evenings set up the cool-down that starts sleep.</text><line x1="120" y1="330" x2="880" y2="330" stroke="#1F3A5F" stroke-width="2.5" stroke-linecap="round"/><g fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="220" cy="190" r="26" stroke="#1F3A5F" stroke-width="3"/><line x1="220" y1="148" x2="220" y2="136" stroke="#1F3A5F" stroke-width="3"/><line x1="220" y1="244" x2="220" y2="232" stroke="#1F3A5F" stroke-width="3"/><line x1="178" y1="190" x2="166" y2="190" stroke="#1F3A5F" stroke-width="3"/><line x1="274" y1="190" x2="262" y2="190" stroke="#1F3A5F" stroke-width="3"/><line x1="190" y1="160" x2="182" y2="152" stroke="#1F3A5F" stroke-width="3"/><line x1="250" y1="160" x2="258" y2="152" stroke="#1F3A5F" stroke-width="3"/><line x1="190" y1="220" x2="182" y2="228" stroke="#1F3A5F" stroke-width="3"/><line x1="250" y1="220" x2="258" y2="228" stroke="#1F3A5F" stroke-width="3"/><path d="M 714 170 A 34 34 0 1 0 740 230 A 28 28 0 0 1 714 170 Z" stroke="#1F3A5F" stroke-width="3"/><path d="M 340 240 C 440 236 560 236 660 252 C 740 265 800 282 860 300" stroke="#52709E" stroke-width="3.5" stroke-dasharray="1 8"/></g><g font-family="Helvetica, Arial, sans-serif" text-anchor="middle"><text x="220" y="292" font-size="15" fill="#1F3A5F" font-weight="bold">Morning: bright, outside</text><text x="220" y="312" font-size="13" fill="#52709E">five minutes counts</text><text x="724" y="292" font-size="15" fill="#1F3A5F" font-weight="bold">Evening: dim, warm light</text><text x="724" y="312" font-size="13" fill="#52709E">screens low, lamps amber</text><text x="490" y="368" font-size="13.5" fill="#52709E">core temperature</text></g><path d="M 170 376 C 300 372 540 372 650 384 C 730 393 800 406 850 414" fill="none" stroke="#1F3A5F" stroke-width="3.5" stroke-linecap="round"/><text x="862" y="420" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1F3A5F" font-weight="bold" text-anchor="start">sleep</text><polyline points="843,409 853,415 844,421" fill="none" stroke="#1F3A5F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
